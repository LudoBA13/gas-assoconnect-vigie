type = "issue"
description = "Partenaires faisant partie du réseau Andès ou UGESS mais ne sont pas de type épicerie sociale."
message = "Fait partie du réseau {3} mais n'est pas une épicerie sociale."
formula = '''
=LET(
  dbHeaders; ACStructures!$1:$1;
  dbRows;    ACStructures!$2:$1000;

  outputHeaders; { "ID du Contact" \ "Nom" \ "Appartient-il à un grand réseau ayant une habilitation nationale ?" };
  outputIndexes; BYCOL(outputHeaders; LAMBDA(colName; MATCH(colName; dbHeaders; 0)));

  typeCol;    INDEX(dbRows; 0; MATCH("Type de structure"; dbHeaders; 0));
  modesCol;   INDEX(dbRows; 0; MATCH("Modes de distribution de l'aide alimentaire"; dbHeaders; 0));
  networkCol; INDEX(dbRows; 0; MATCH("Appartient-il à un grand réseau ayant une habilitation nationale ?"; dbHeaders; 0));

  outputRows; FILTER(
    CHOOSECOLS(dbRows; outputIndexes);
    ISNUMBER(FIND("1_Partenaire"; typeCol));
    ISERR(FIND("Epicerie Sociale"; modesCol));
    REGEXMATCH(networkCol; "^ANDES|^UGESS")
  );

  VSTACK(outputHeaders; outputRows)
)
'''